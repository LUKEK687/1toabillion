kind = "mobile"
previewPath = "/one-to-billionaire/"
title = "$1 to Billionaire"
description = "A fast-paced offline Android wealth-building decision game where every run starts with one dollar and challenges players to reach one billion through fictional hustles, businesses, investments, luck, and risk."
version = "1.0.0"
id = "artifacts/one-to-billionaire"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/one-to-billionaire/" ]
localPort = 18439

[services.development]
run = "pnpm --filter @workspace/one-to-billionaire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/one-to-billionaire", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/one-to-billionaire", "run", "serve" ]

[services.env]
PORT = "18439"
BASE_PATH = "/one-to-billionaire/"
