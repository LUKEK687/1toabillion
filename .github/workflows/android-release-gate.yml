name: Android release gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: android-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-gate:
    name: Deterministic suite and native gesture smoke
    # Pinned to ubuntu-22.04: reactivecircus/android-emulator-runner fails on
    # ubuntu-24.04 (the current ubuntu-latest) because avdmanager can't create
    # its AVD config directory there. See
    # https://github.com/ReactiveCircus/android-emulator-runner/issues/400
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      APP_DIR: artifacts/one-to-billionaire
      APK_PATH: artifacts/one-to-billionaire/android/app/build/outputs/apk/release/app-release.apk
      MAESTRO_RESULTS_DIR: artifacts/one-to-billionaire/test-results/maestro

    steps:
      - name: Free disk space for Android build + emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          df -h /

      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # No gradle cache key: the android/ Gradle project doesn't exist
          # yet at this point (it's generated by `expo prebuild` below), so
          # `cache: gradle` has no wrapper file to hash and fails checkout.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic release suite
        run: pnpm --filter @workspace/one-to-billionaire run test:release

      - name: Generate Android release project
        working-directory: ${{ env.APP_DIR }}
        run: CI=1 pnpm exec expo prebuild --platform android --no-install

      - name: Build release-candidate APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > /tmp/gradle-build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::group::Gradle build log (last 200 lines)"
            tail -n 200 /tmp/gradle-build.log
            echo "::endgroup::"
            awk '/createBundleReleaseJsAndAssets/,/^BUILD FAILED/' /tmp/gradle-build.log | grep -v '^\s*at ' | head -n 80 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: Verify release-candidate APK
        run: test -s "$APK_PATH"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Report disk space before emulator boot
        run: df -h /

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native Android gesture gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -o pipefail
            mkdir -p "$MAESTRO_RESULTS_DIR"
            adb install -r "$APK_PATH"
            maestro test \
              --format JUNIT \
              --output "$MAESTRO_RESULTS_DIR/results.xml" \
              "$APP_DIR/.maestro/android-smoke.yaml" \
              2>&1 | tee "$MAESTRO_RESULTS_DIR/maestro.log"
            status=$?
            if [ $status -ne 0 ]; then
              tail -n 60 "$MAESTRO_RESULTS_DIR/maestro.log" | while IFS= read -r line; do
                echo "::error::${line}"
              done
            fi
            exit $status

      - name: Capture Android diagnostics
        if: always()
        run: |
          mkdir -p "$MAESTRO_RESULTS_DIR"
          timeout 30 adb logcat -d > "$MAESTRO_RESULTS_DIR/logcat.txt" 2>&1 || true
          timeout 30 adb shell dumpsys activity activities > "$MAESTRO_RESULTS_DIR/activities.txt" 2>&1 || true

      - name: Upload Android gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.MAESTRO_RESULTS_DIR }}
            ~/.maestro/tests

      - name: Upload tested release-candidate APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.APK_PATH }}

  publish-android-release:
    name: Publish gated Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-production
    permissions:
      contents: write

    steps:
      - name: Verify tag still targets tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object_type="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object.type')"
          tag_object_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object.sha')"

          if [ "$tag_object_type" = "tag" ]; then
            tag_object_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
              --jq '.object.sha')"
          fi

          test "$tag_object_sha" = "$GITHUB_SHA"

      - name: Download tested release-candidate APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-candidate-${{ github.sha }}
          path: release

      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release/app-release.apk
          gh release create "$GITHUB_REF_NAME" \
            release/app-release.apk#one-to-billionaire-${GITHUB_REF_NAME}.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
